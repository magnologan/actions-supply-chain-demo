# ============================================================
# BEFORE - the way most pipelines look in the wild
#
# Three problems, all of them ordinary:
#   1. Third-party action referenced by MUTABLE TAG (@v1)
#   2. GITHUB_TOKEN left at repo default (may be read-write)
#   3. Deployment secrets live in the SAME job as untrusted code
#
# This is the configuration tj-actions/changed-files users had
# in March 2025 (CVE-2025-30066).
# ============================================================

name: Build (vulnerable)

on:
  workflow_dispatch:

# NOTE: no `permissions:` block at all.
# The token inherits the repo/org default, which for any repo or org
# created before Feb 2023 (and never changed since) is READ-WRITE.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4        # <-- mutable tag

      - name: Analyze changed files
        uses: ./demo-action              # <-- stands in for the compromised third party
        env:
          # Everything this job holds is visible to every step in the job.
          DEPLOY_KEY: ${{ secrets.DEMO_DEPLOY_KEY }}
          NPM_TOKEN: ${{ secrets.DEMO_NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEMO_LISTENER: ${{ vars.DEMO_LISTENER }}

      - name: Deploy
        run: echo "deploying..."
        env:
          DEPLOY_KEY: ${{ secrets.DEMO_DEPLOY_KEY }}
