# ============================================================
# BEFORE - the way most pipelines look in the wild
#
# Three problems, all of them ordinary:
#   1. Actions referenced by MUTABLE TAG (actions/checkout@v4; in the
#      real incident, tj-actions/changed-files@v35 / @v45)
#   2. GITHUB_TOKEN left at repo default (may be read-write)
#   3. Deployment secrets live in the SAME job as untrusted code
#
# This is the configuration tj-actions/changed-files users had
# in March 2025 (CVE-2025-30066).
# ============================================================

name: Build (vulnerable)

on:
  workflow_dispatch:

# NOTE: no `permissions:` block at all.
# The token inherits the repo/org default. That is READ-WRITE for any repo
# or org created before Feb 2023 (GitHub did not change existing ones), and
# for any newer one where someone switched it back. This demo repo is set
# to read-write so you can see it.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4        # <-- mutable tag

      - name: Analyze changed files
        uses: ./demo-action              # <-- local stand-in for tj-actions/changed-files@v45
        env:
          # Passed via env here so the leak is readable on screen. The real
          # payload did not need this: it read every secret the job references
          # (including the Deploy step's) from Runner.Worker memory.
          DEPLOY_KEY: ${{ secrets.DEMO_DEPLOY_KEY }}
          NPM_TOKEN: ${{ secrets.DEMO_NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEMO_LISTENER: ${{ vars.DEMO_LISTENER }}

      - name: Deploy
        run: echo "deploying..."
        env:
          DEPLOY_KEY: ${{ secrets.DEMO_DEPLOY_KEY }}
